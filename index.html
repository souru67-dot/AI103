<style>
/* Layout: 答案用紙。上に科目ヘッダー、中央に1問ずつのカード、下に親指で押せる操作バー */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#18212f; --sub:#5b6677; --rule:#d9dfe8;
  --accent:#1f5fd6; --accent-ink:#ffffff; --accent-soft:#e6eefc;
  --ok:#1d7a4f; --ok-soft:#e3f3ea; --ng:#b8322b; --ng-soft:#fbe7e5; --flag:#b26a00; --flag-soft:#fff1dc;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141c; --sheet:#171e29; --ink:#e7ecf3; --sub:#9aa6b8; --rule:#2a3442;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1b2a45;
  --ok:#5fcf98; --ok-soft:#14301f; --ng:#ff8a80; --ng-soft:#3a1a18; --flag:#ffb45c; --flag-soft:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141c; --sheet:#171e29; --ink:#e7ecf3; --sub:#9aa6b8; --rule:#2a3442;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-soft:#1b2a45;
  --ok:#5fcf98; --ok-soft:#14301f; --ng:#ff8a80; --ng-soft:#3a1a18; --flag:#ffb45c; --flag-soft:#3a2a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 130px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.code{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--accent)}
h1{font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.2;margin:2px 0 0;text-wrap:balance}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;margin:0;color:var(--sub)}
.meta{font-size:13px;color:var(--sub);line-height:1.6;margin:0}
.note{font-size:13px;color:var(--sub);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;line-height:1.7}
.note a,.links a{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:16px}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tile.resume{border:2px solid var(--accent);background:var(--accent-soft)}
.weight{font-family:var(--f-mono);font-size:12px;color:var(--sub);white-space:nowrap}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:11px 18px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.btn[disabled]{opacity:.4;cursor:default}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0}
.chip.type{background:var(--paper);color:var(--sub);border:1px solid var(--rule)}
.count{font-family:var(--f-mono);font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qtext{font-size:17px;font-weight:500;line-height:1.85;margin:0}
.hint{font-size:13px;font-weight:700;color:var(--accent);margin:-6px 0 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;font:inherit;font-size:15px;line-height:1.65;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;width:100%}
.opt .k{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border:1.5px solid var(--sub);display:grid;place-items:center;color:var(--sub);margin-top:1px;border-radius:50%}
.opt.multi .k{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.opt[disabled]{cursor:default}
.yn{display:flex;flex-direction:column;gap:10px}
.ynrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.ynrow.right{border-color:var(--ok)} .ynrow.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ynrow p{margin:0;font-size:15px;line-height:1.65;min-width:0}
.seg{display:flex;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--sheet);color:var(--sub);padding:8px 14px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button[disabled]{cursor:default}
.ynrow .ans{grid-column:1/-1;font-size:13px;font-weight:700}
.ord{display:flex;flex-direction:column;gap:12px}
.ord h3{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sub);margin:0}
.slot{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6}
.slot .n{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.slot.right{background:var(--ok-soft);border-color:var(--ok)} .slot.wrong{background:var(--ng-soft);border-color:var(--ng)}
.slot button{font:inherit;border:0;background:transparent;color:var(--sub);font-size:20px;cursor:pointer;padding:0 6px;min-height:36px}
.empty{font-size:13px;color:var(--sub);border:1.5px dashed var(--rule);border-radius:10px;padding:12px;text-align:center}
.pool{display:flex;flex-direction:column;gap:8px}
.correct-order{margin:0;padding-left:1.4em;font-size:14px}
.verdict{font-weight:900;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.explain{border-top:1px dashed var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.explain p{margin:0;font-size:15px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
.links{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.links a{font-size:14px;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.flagbtn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--flag);color:var(--flag);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.flagbtn.on{background:var(--flag-soft)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.navgrid button{font-family:var(--f-mono);font-size:15px;font-weight:600;height:48px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--sub);cursor:pointer;position:relative}
.navgrid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.navgrid button.flag::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--flag)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sheet);border:1.5px solid var(--rule)}
.legend .l-done::before{background:var(--accent-soft);border-color:var(--accent)}
.legend .l-flag::before{background:var(--flag);border-color:var(--flag);border-radius:50%}
.confirm{border:2px solid var(--ng);border-radius:12px;padding:14px 16px;background:var(--ng-soft);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1;padding-inline:10px}
.score{font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--sub);font-weight:700}
.pass{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.pass.ok{background:var(--ok-soft);color:var(--ok)} .pass.ng{background:var(--ng-soft);color:var(--ng)}
table.sum{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.sum td{border-bottom:1px solid var(--rule);padding:8px 4px}
table.sum td:last-child{text-align:right;font-family:var(--f-mono)}
details.rev{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
details.rev summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;font-size:14px}
details.rev summary::-webkit-details-marker{display:none}
details.rev summary .count{white-space:nowrap}
details.rev summary .mk{font-weight:900;font-family:var(--f-mono);min-width:1.2em}
details.rev summary .mk.ok{color:var(--ok)} details.rev summary .mk.ng{color:var(--ng)}
details.rev summary .t{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
details.rev[open] summary{margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:6px 14px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--sub);cursor:pointer;min-height:38px}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 {d:"gen",t:"s",q:"社員が社内規程の PDF をアップロードし、その内容に基づいてエージェントに答えさせたいです。既存の検索インデックスはありません。使う組み込みツールはどれですか。",
  o:["File Search","Code Interpreter","Web search","Azure Functions"],a:0,
  e:"File Search はアップロードしたファイルや独自の文書をベクトル検索でグラウンディングに使うツールです。すでに AI Search のインデックスがあるなら Azure AI Search ツールを使います。",l:["tools"]},
 {d:"gen",t:"s",q:"ユーザーがアップロードした CSV を集計してグラフを作る機能をエージェントに持たせたいです。どのツールを使いますか。",
  o:["File Search","Code Interpreter","OpenAPI","SharePoint"],a:1,

 {d:"gen",t:"s",q:"運用中の Azure AI Search インデックスに入っている製品マニュアルで、エージェントの回答をグラウンディングしたいです。最も適切なツールはどれですか。",
  o:["File Search","Azure AI Search ツール","Web search","Code Interpreter"],a:1,
  e:"既存の AI Search インデックスのデータでグラウンディングするには Azure AI Search ツールを使います。File Search はファイルをアップロードしてベクトルストアを作る用途です。",l:["tools"]},
 {d:"gen",t:"s",q:"社内の在庫照会 API があり、OpenAPI 3.0 の仕様書が用意されています。エージェントからこの API を呼ばせる最も簡単な方法はどれですか。",
  o:["OpenAPI ツール（カスタムツール）を追加する","Code Interpreter で HTTP リクエストを書かせる","Web search ツールを使う","File Search に仕様書を入れる"],a:0,
  e:"OpenAPI ツールは OpenAPI 3.0 / 3.1 の仕様で記述された外部の HTTP API にエージェントを接続するカスタムツールです。仕様に基づいてモデルが呼び出しを組み立てます。",l:["tools"]},
 {d:"gen",t:"s",q:"最新のニュースなど公開 Web の情報を、引用付きで回答に使いたいです。どのツールを使いますか。",
  o:["Web search","File Search","Azure AI Search ツール","Memory"],a:0,
  e:"Web search ツールはリアルタイムの公開 Web 情報を取得し、インライン引用付きで回答します。ネットワーク分離された環境でも動作しますが、通信は公開インターネット経由になります。",l:["tools","privatelink"]},
 {d:"gen",t:"s",q:"複数のエージェントで同じツール群を使い回したいです。ツールの追加や変更のたびにエージェントのコードを直したくありません。推奨される方法はどれですか。",
  o:["Foundry の Toolbox にツールをまとめ、エージェントからは 1 つの MCP エンドポイントとして参照する","各エージェントにツールをコピーする","すべてのツールを 1 つの関数にまとめる","ツールを使わずプロンプトに API 仕様を書く"],a:0,
  e:"Toolbox は複数のツールを 1 つの MCP エンドポイントの背後にまとめる仕組みで、エージェントにツールを渡す推奨の方法です。Toolbox 側でツールを追加・変更しても、エージェントのコードを変える必要はありません。",l:["tools","mcp"]},
 {d:"gen",t:"s",q:"サポート用エージェントに、ユーザーの言語の好みや使っている製品を、次回以降の会話でも覚えておいてほしいです。どの機能を使いますか。",
  o:["会話履歴を毎回すべてプロンプトに入れる","Agent Service のメモリ（ユーザープロファイルメモリ）","File Search","temperature を下げる"],a:1,
  e:"Agent Service のメモリ（プレビュー）は、会話から重要な情報を抽出・統合し、セッションをまたいで保持します。ユーザープロファイルメモリは言語の好みなど継続的な情報向けで、会話の最初に取り出すのが基本です。",l:["memory"]},
 {d:"gen",t:"yn",q:"Agent Service のメモリについて、それぞれ正しければ「はい」、誤っていれば「いいえ」を選んでください。",
  o:["ユーザープロファイル、チャット要約、手続き（procedural）の 3 種類が既定で有効になっている","メモリストアは仮想ネットワーク統合に対応している","スコープに {{$userId}} を指定して呼び出し元の ID から自動解決できるのは、メモリ検索ツールを使う場合だけ"],a:[true,false,true],
  e:"3 種類の長期メモリはすべて既定で有効です。メモリストアは VNet 統合に対応していません。低レベルのメモリ API ではスコープを毎回明示する必要があり、ID からの自動解決はメモリ検索ツールでのみ使えます。",l:["memory"]},
 {d:"gen",t:"s",q:"エージェントのメモリは LLM が会話から抽出して保存します。悪意ある入力で誤った内容が保存されるリスクへの対策として、Learn で挙げられているものはどれですか。",
  o:["メモリを毎日すべて削除する","Content Safety（プロンプトインジェクション検出を含む）で入力を検証し、定期的に敵対的テストを行う","メモリの TTL を無期限にする","ユーザーごとのスコープをやめる"],a:1,
  e:"メモリはプロンプトインジェクションやメモリ汚染のリスクがあります。Content Safety による検証と、定期的な敵対的テストが対策として挙げられています。保持期間はストアの TTL や個別削除で管理できます。",l:["memory"]},
 {d:"gen",t:"s",q:"「先月の売上と、昨年同月の比較と、その要因」のような複合的な質問に対して、複数の観点で検索したいです。Azure AI Search の機能で最も合うものはどれですか。",
  o:["単一のキーワード検索","エージェント的取得（Agentic retrieval）のクエリ計画","シノニムマップ","スコアリングプロファイル"],a:1,
  e:"エージェント的取得では、LLM が複雑な質問を焦点を絞ったサブクエリに分解し、並列に実行してから結果を統合します。会話履歴を踏まえた追加質問や言い換えにも対応できる一方、レイテンシは増えます。",l:["agentic"]},
 {d:"gen",t:"s",q:"エージェント的取得のナレッジベースで、推論レベル（reasoning effort）を minimal にしました。何が起きますか。",
  o:["LLM によるクエリ計画が省略される","セマンティックランカーが無効になる","ナレッジソースが使えなくなる","回答が必ず生成される"],a:0,
  e:"minimal では LLM によるクエリ計画がスキップされます。クエリ計画が動くのは low と medium です。既定値は low で、ナレッジベースで設定します。",l:["agentic"]},
 {d:"gen",t:"s",q:"エージェント的取得の「ナレッジソース」の種類として正しい組み合わせはどれですか。",
  o:["インデックス型（検索インデックスを使う）とリモート型（クエリ時に外部から取得する）","パブリック型とプライベート型","テキスト型と画像型","同期型と非同期型"],a:0,
  e:"ナレッジソースは、自分の検索サービスのインデックスを使うインデックス型と、クエリ時に外部プラットフォームから取得するリモート型があります。最低 1 つのナレッジソースとナレッジベースが必要です。",l:["agentic"]},
 {d:"gen",t:"yn",q:"エージェント的取得について、それぞれ正しければ「はい」、誤っていれば「いいえ」を選んでください。",

  e:"サブクエリは同時に実行され、それぞれセマンティックランカーで再ランク付けされます。常に返るのは統合されたグラウンディング用のコンテンツで、回答の合成はプレビューのオプション機能です。",l:["agentic"]},
 {d:"gen",t:"ord",q:"Azure AI Search を使った RAG アプリの基本的な処理を、正しい順に並べてください。",

  e:"RAG では、まずデータを検索できる形に整え（取り込み・分割・ベクトル化・インデックス化）、実行時に質問で関連情報を取り出してから LLM に渡します。生成の後に Groundedness などで品質を評価します。",l:["ragSearch","intVec"]},

  o:["name、evaluators、data（各要素に query）","agent_id と api_key","model と temperature","threshold だけ"],a:0,
  e:"データファイルにはデータセット名の name、評価器の一覧 evaluators（例: builtin.task_adherence）、query を含む data 配列が必要です。ground_truth や context、しきい値の evaluator_parameters は任意です。",l:["ghaction"]},
 {d:"gen",t:"s",q:"エージェントのツール呼び出しが、技術的なエラーなくすべて成功しているかを評価したいです。使う評価器はどれですか。",

  e:"Tool Call Success は、すべてのツール呼び出しが技術的な失敗なく実行されたかを評価します。呼び出しの選択が正しいかは Tool Call Accuracy、タスクへの忠実さは Task Adherence で見ます。",l:["builtinEval"]},
 {d:"gen",t:"m",q:"RAG アプリの品質評価で推奨される評価器の組み合わせから、3 つ選んでください（安全性の評価器は別途追加するとします）。",
  o:["Retrieval","Groundedness","Relevance","BLEU","METEOR"],a:[0,1,2],
  e:"Learn では RAG アプリには Retrieval・Groundedness・Relevance に Content Safety を組み合わせる構成が推奨されています。BLEU と METEOR は翻訳の評価で使う指標です。",l:["builtinEval"]},
 {d:"gen",t:"s",q:"翻訳アプリの出力品質を、正解訳と比べて評価したいです。推奨される組み合わせに含まれる評価器はどれですか。",
  o:["BLEU と METEOR","Task Adherence と Intent Resolution","Groundedness Pro","Tool Call Accuracy"],a:0,
  e:"翻訳アプリには BLEU・METEOR・Fluency・Coherence の組み合わせが推奨されています。BLEU や METEOR は正解との n-gram の重なりを測る指標です。",l:["builtinEval"]},
 {d:"gen",t:"s",q:"1 回の応答ではなく、複数ターンの会話全体としてタスクが達成できたかを評価したいです。評価の実行時に何を設定しますか。",
  o:["evaluation_level を会話（conversation）レベルにする","temperature を下げる","評価器をすべて外す","モデルを変える"],a:0,
  e:"評価の実行時に evaluation_level を指定します。省略時はターン単位です。会話レベルの評価器は、ユーザー満足度や複数ステップにまたがるタスク達成など、やり取り全体を採点します。1 回の実行内の評価器は同じレベルに対応している必要があります。",l:["builtinEval"]},
 {d:"gen",t:"s",q:"経費精算の処理を複数のエージェントで自動化しますが、高額な申請だけは担当者の承認を挟みたいです。Foundry のワークフローで使うパターンはどれですか。",

  e:"Foundry のワークフローには順次、グループチャット、ヒューマン・イン・ザ・ループのパターンがあります。人の判断を途中に入れたい場合はヒューマン・イン・ザ・ループを使います。",l:["a2a"]},

 {d:"vision",t:"s",q:"ニュース番組の録画を、ニュースの話題ごとに区切って、それぞれに説明を付けたいです。Content Understanding の動画アナライザーでどう構成しますか。",

  e:"カスタム分割（enableSegment: true）では、contentCategories に自然言語で区切り方を指定してセグメントを作ります。セグメントは数秒から数分まで可変です。分割を有効にすると、フィールドを定義していなくても生成モデルのトークンを消費します。",l:["cuVideo"]},
 {d:"vision",t:"s",q:"動画全体を 1 つの単位として、規定に違反する内容がないかチェックし、全体の要約を作りたいです。どう設定しますか。",

 {d:"vision",t:"yn",q:"Content Understanding の動画分析の制約について、それぞれ正しければ「はい」、誤っていれば「いいえ」を選んでください。",

 {d:"vision",t:"s",q:"動画のカット（ショット）の切り替わり位置をミリ秒単位で取得したいです。何を指定しますか。",

 {d:"vision",t:"s",q:"画像検索のために、各画像の内容を 1 段落程度の説明文にしてインデックスに入れたいです。Content Understanding の事前構築済みアナライザーで最も合うものはどれですか。",

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const range=n=>[...Array(n).keys()];
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};

function emptyAns(q){return q.t==="m"?[]:q.t==="yn"?q.o.map(()=>null):q.t==="ord"?[]:null}
function isAnswered(q,a){if(a==null)return false;if(q.t==="m")return a.length>0;if(q.t==="yn")return a.every(v=>v!==null);if(q.t==="ord")return a.length===q.o.length;return true}
function isCorrect(q,a){
  if(!isAnswered(q,a))return false;
  if(q.t==="s")return a===q.a;
  if(q.t==="m"){const x=a.slice().sort(),y=q.a.slice().sort();return x.length===y.length&&x.every((v,i)=>v===y[i])}
  if(q.t==="yn")return a.every((v,i)=>v===q.a[i]);
  if(q.t==="ord")return a.every((v,i)=>v===i);
}
const linksHTML=q=>`<ul class="links">${q.l.map(k=>`<li><a href="${L[k][1]}" target="_blank" rel="noopener">${esc(L[k][0])}</a></li>`).join("")}</ul>`;

/* ---------- 問題の描画（勉強・試験・見直しで共通） ---------- */
function renderQuestion(box, q, st, opts){
  // st: {ans, order, pool}  opts: {locked, reveal, onChange}
  const locked=opts.locked, reveal=opts.reveal;
  let h=`<p class="qtext">${esc(q.q)}</p>`;
  if(TYPE_HINT[q.t]) h+=`<p class="hint">${TYPE_HINT[q.t](q.t==="m"?q.a.length:0)}</p>`;
  if(q.t==="s"||q.t==="m"){
    h+=`<div class="opts" role="${q.t==="s"?"radiogroup":"group"}">`+st.order.map((k,n)=>{
      const sel=q.t==="s"?st.ans===k:st.ans.includes(k);
      let cls="opt"+(q.t==="m"?" multi":"");
      if(reveal){const good=q.t==="s"?k===q.a:q.a.includes(k); if(good)cls+=" right"; else if(sel)cls+=" wrong";}
      else if(sel)cls+=" sel";
      return `<button class="${cls}" data-k="${k}" ${locked?"disabled":""} aria-pressed="${sel}"><span class="k">${"ABCDEF"[n]}</span><span>${esc(q.o[k])}</span></button>`}).join("")+`</div>`;
  } else if(q.t==="yn"){
    h+=`<div class="yn">`+q.o.map((s,i)=>{
      const v=st.ans[i]; let cls="ynrow"; if(reveal)cls+=v===q.a[i]?" right":" wrong";
      return `<div class="${cls}"><p>${esc(s)}</p><div class="seg" role="group"><button data-i="${i}" data-v="1" class="${v===true?"on":""}" ${locked?"disabled":""}>はい</button><button data-i="${i}" data-v="0" class="${v===false?"on":""}" ${locked?"disabled":""}>いいえ</button></div>${reveal?`<span class="ans" style="color:${v===q.a[i]?"var(--ok)":"var(--ng)"}">正解：${q.a[i]?"はい":"いいえ"}</span>`:""}</div>`}).join("")+`</div>`;
  } else if(q.t==="ord"){
    const used=new Set(st.ans);
    h+=`<div class="ord"><h3>あなたの並び順</h3>`+(st.ans.length?st.ans.map((k,n)=>`<div class="slot${reveal?(k===n?" right":" wrong"):""}"><span class="n">${n+1}</span><span>${esc(q.o[k])}</span>${locked?"":`<button data-rm="${n}" aria-label="外す">×</button>`}</div>`).join(""):`<div class="empty">まだ選んでいません</div>`);
    if(!locked){const rest=st.pool.filter(k=>!used.has(k));
      if(rest.length)h+=`<h3>候補</h3><div class="pool">`+rest.map(k=>`<button class="opt" data-add="${k}"><span class="k">+</span><span>${esc(q.o[k])}</span></button>`).join("")+`</div>`;}
    if(reveal)h+=`<h3>正しい順</h3><ol class="correct-order">${q.o.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
    h+=`</div>`;
  }
  box.innerHTML=h;
  if(locked)return;
  box.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(q.t==="s")st.ans=k; else st.ans=st.ans.includes(k)?st.ans.filter(x=>x!==k):st.ans.concat(k);
    opts.onChange();});
  box.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{st.ans[+b.dataset.i]=b.dataset.v==="1";opts.onChange()});
  box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{st.ans=st.ans.concat(+b.dataset.add);opts.onChange()});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{st.ans=st.ans.filter((_,i)=>i!==+b.dataset.rm);opts.onChange()});
}
function explainHTML(q,ok){
  return `<div class="explain"><div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</div>
   <span class="lbl">解説・根拠</span><p>${esc(q.e)}</p><span class="lbl">Microsoft Learn</span>${linksHTML(q)}</div>`;
}
function newState(q){return {ans:emptyAns(q),order:shuffle(range(q.o.length)),pool:shuffle(range(q.o.length))}}

  <p class="meta">1問ずつ解いて、すぐに解説と根拠を確認します。解答済み ${sDone} ／ 正解 ${sOk}</p>
  <div class="actions"><button class="btn" id="stAll">全問シャッフル</button>
   <button class="btn ghost" id="stWrong" ${wrong.length?"":"disabled"}>間違えた問題（${wrong.length}）</button>
   <button class="btn ghost" id="stFlag" ${flags.length?"":"disabled"}>見直しマーク（${flags.length}）</button></div>
  <div class="grid">${domTiles}</div>
  <div class="note">Microsoft Learn の公式スタディガイド（2026年4月16日時点の出題範囲）に沿ったオリジナル問題です。実際の試験問題ではありません。本番の問題数や時間は回によって異なるため、ここでは 40 問・100 分、700 点（1000 点満点換算）を合格の目安にしています。本番のスコアは単純な正答率ではありません。<br><a href="${L.guide[1]}" target="_blank" rel="noopener">AI-103 スタディガイドを開く</a></div>
  <div class="actions"><button class="btn ghost" id="reset">記録をリセット</button></div>
  <p class="meta" id="resetMsg" hidden>記録をリセットしました。</p>`;
  app.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>examIntro(+b.dataset.exam));
  app.querySelectorAll("[data-dom]").forEach(b=>b.onclick=()=>study(range(Q.length).filter(i=>Q[i].d===b.dataset.dom)));
  document.getElementById("stAll").onclick=()=>study(range(Q.length));
  document.getElementById("stWrong").onclick=()=>study(wrong);
  document.getElementById("stFlag").onclick=()=>study(flags);
  const rs=document.getElementById("resume"); if(rs)rs.onclick=()=>examRun();
  const r=document.getElementById("reset");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="もう一度押すとリセット";r.classList.add("warn");return}
    store={study:{},flags:{},exams:{}};save();home();document.getElementById("resetMsg").hidden=false};
}

/* ---------- 勉強モード ---------- */
let S=null;
function study(ids){ if(!ids.length)return; S={ids:shuffle(ids),pos:0,ok:0,res:{}}; studyShow(); }
function studyShow(){
  view="study"; window.scrollTo(0,0);
  const id=S.ids[S.pos], q=Q[id]; S.st=newState(q); S.done=false;
  app.innerHTML=`<div class="qhead"><span><span class="chip">${DOMAINS[q.d].name}</span> <span class="chip type">${TYPE_LABEL[q.t]}</span></span><span class="count">${S.pos+1} / ${S.ids.length}</span></div>
   <div class="progress"><i style="width:${S.pos/S.ids.length*100}%"></i></div>
   <section class="card"><div id="qbox"></div><div id="exp"></div>
   <div><button class="flagbtn ${store.flags[id]?"on":""}" id="flag">${store.flags[id]?"見直しマーク済み":"見直しマークを付ける"}</button></div></section>`;
  const box=document.getElementById("qbox");
  const draw=()=>{renderQuestion(box,q,S.st,{locked:S.done,reveal:S.done,onChange:draw});studyDock()};
  S.draw=draw; draw();
  document.getElementById("flag").onclick=e=>{store.flags[id]=!store.flags[id];if(!store.flags[id])delete store.flags[id];save();
    e.target.classList.toggle("on",!!store.flags[id]);e.target.textContent=store.flags[id]?"見直しマーク済み":"見直しマークを付ける"};
}
function studyDock(){
  const id=S.ids[S.pos], q=Q[id], last=S.pos===S.ids.length-1;
  setDock(`<button class="btn ghost" id="quit">やめる</button>`+(S.done?`<button class="btn" id="nx">${last?"結果を見る":"次の問題"}</button>`:`<button class="btn" id="chk" ${isAnswered(q,S.st.ans)?"":"disabled"}>解答する</button>`));
  document.getElementById("quit").onclick=home;
  const c=document.getElementById("chk"); if(c)c.onclick=()=>{const ok=isCorrect(q,S.st.ans);S.done=true;S.res[id]=ok;if(ok)S.ok++;store.study[id]=ok;save();
    S.draw();document.getElementById("exp").innerHTML=explainHTML(q,ok)};
  const x=document.getElementById("nx"); if(x)x.onclick=()=>{if(last)studyResult();else{S.pos++;studyShow()}};
}
function studyResult(){
  view="sres"; setDock(""); window.scrollTo(0,0);
  const n=S.ids.length, wrong=S.ids.filter(i=>!S.res[i]);
  app.innerHTML=`<header class="top"><div><div class="code">STUDY</div><h1>勉強モードの結果</h1></div></header>
  <section class="card"><div class="score">${S.ok}<small> / ${n} 問正解</small></div></section>
  <div class="actions"><button class="btn" id="retry" ${wrong.length?"":"disabled"}>間違えた${wrong.length}問を解き直す</button><button class="btn ghost" id="back">トップへ戻る</button></div>`;
  document.getElementById("retry").onclick=()=>study(wrong);
  document.getElementById("back").onclick=home;
}

/* ---------- 試験モード ---------- */
function examIntro(n){
  stopTick(); view="intro"; window.scrollTo(0,0);
  const ids=EXAMS[n], by={}; ids.forEach(i=>by[Q[i].d]=(by[Q[i].d]||0)+1);
  const act=store.active;
  app.innerHTML=`<header class="top"><div><div class="code">MOCK EXAM ${n+1}</div><h1>模擬試験 ${n+1}</h1></div></header>
  <section class="card"><p class="meta" style="font-size:15px;color:var(--ink)">${ids.length} 問・制限時間 ${EXAM_MIN} 分。時間になると自動で採点します。解答は最後まで変更でき、見直しマークを付けて後から戻れます。正誤と解説は終了後にまとめて表示します。</p>
  <table class="sum">${Object.entries(DOMAINS).map(([k,v])=>`<tr><td>${v.name}</td><td>${by[k]||0} 問</td></tr>`).join("")}</table>
  <p class="meta">複数選択・はい/いいえ・並べ替えは、すべて正しい場合のみ正解として数えます。</p></section>
  ${act?`<div class="confirm"><p>模擬試験 ${act.exam+1} が途中です。新しく始めると、途中の解答は破棄されます。</p></div>`:""}`;
  setDock(`<button class="btn ghost" id="bk">戻る</button><button class="btn" id="go">${act?"破棄して開始":"試験を開始"}</button>`);
  document.getElementById("bk").onclick=home;
  document.getElementById("go").onclick=()=>{const ord=shuffle(ids);
    store.active={exam:n,ids:ord,st:ord.map(i=>newState(Q[i])),flags:{},pos:0,endAt:Date.now()+EXAM_MIN*60000};save();examRun()};
}
function examRun(){
  const A=store.active; if(!A){home();return}
  view="exam"; stopTick();
  tick=setInterval(()=>{const left=(A.endAt-Date.now())/1000;const t=document.getElementById("timer");
    if(t){t.textContent=fmt(left);t.classList.toggle("low",left<300)} if(left<=0){stopTick();examFinish()}},1000);
  if(A.endAt<=Date.now()){examFinish();return}
  examShow();
}
function examShow(){
  const A=store.active; window.scrollTo(0,0);
  const id=A.ids[A.pos], q=Q[id], st=A.st[A.pos];
  const answered=A.ids.filter((x,i)=>isAnswered(Q[x],A.st[i].ans)).length;
  app.innerHTML=`<div class="qhead"><span class="code">模擬試験 ${A.exam+1}</span><span class="timer" id="timer">${fmt((A.endAt-Date.now())/1000)}</span></div>
   <div class="progress"><i style="width:${answered/A.ids.length*100}%"></i></div>
   <div class="qhead"><span><span class="count">問 ${A.pos+1} / ${A.ids.length}</span> <span class="chip type">${TYPE_LABEL[q.t]}</span></span>
   <button class="flagbtn ${A.flags[A.pos]?"on":""}" id="flag">${A.flags[A.pos]?"見直しマーク済み":"見直し"}</button></div>
   <section class="card"><div id="qbox"></div></section>`;
  const box=document.getElementById("qbox");
  const draw=()=>{renderQuestion(box,q,st,{locked:false,reveal:false,onChange:()=>{save();draw()}})}; draw();
  document.getElementById("flag").onclick=()=>{A.flags[A.pos]=!A.flags[A.pos];save();examShow()};
  setDock(`<button class="btn ghost" id="pv" ${A.pos?"":"disabled"}>前へ</button><button class="btn ghost" id="ls">一覧</button><button class="btn" id="nx">${A.pos<A.ids.length-1?"次へ":"一覧へ"}</button>`);
  document.getElementById("pv").onclick=()=>{A.pos--;save();examShow()};
  document.getElementById("ls").onclick=examList;
  document.getElementById("nx").onclick=()=>{if(A.pos<A.ids.length-1){A.pos++;save();examShow()}else examList()};
}
function examList(confirming){
  const A=store.active; window.scrollTo(0,0);
  const un=A.ids.filter((x,i)=>!isAnswered(Q[x],A.st[i].ans)).length, fl=Object.values(A.flags).filter(Boolean).length;
  app.innerHTML=`<div class="qhead"><span class="code">模擬試験 ${A.exam+1}・問題一覧</span><span class="timer" id="timer">${fmt((A.endAt-Date.now())/1000)}</span></div>
   <section class="card"><div class="legend"><span class="l-done">解答済み</span><span>未解答</span><span class="l-flag">見直し</span></div>
   <div class="navgrid">${A.ids.map((x,i)=>`<button data-go="${i}" class="${isAnswered(Q[x],A.st[i].ans)?"done":""} ${A.flags[i]?"flag":""} ${i===A.pos?"cur":""}">${i+1}</button>`).join("")}</div>
   <p class="meta">未解答 ${un} 問 ／ 見直しマーク ${fl} 問</p></section>
   ${confirming?`<div class="confirm"><p>${un?`未解答が ${un} 問あります。`:""}試験を終了して採点しますか。終了すると解答は変更できません。</p><div class="actions"><button class="btn warn" id="fin">終了して採点する</button><button class="btn ghost" id="cancel">試験に戻る</button></div></div>`:""}`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{A.pos=+b.dataset.go;save();examShow()});
  setDock(`<button class="btn ghost" id="bk">問題に戻る</button><button class="btn warn" id="end">試験を終了</button><button class="btn ghost" id="pause">中断</button>`);
  document.getElementById("bk").onclick=examShow;
  document.getElementById("end").onclick=()=>examList(true);
  document.getElementById("pause").onclick=home;
  const f=document.getElementById("fin"); if(f)f.onclick=examFinish;
  const c=document.getElementById("cancel"); if(c)c.onclick=()=>examList(false);
}
function examFinish(){
  const A=store.active; if(!A){home();return} stopTick();
  const res=A.ids.map((x,i)=>({id:x,st:A.st[i],ok:isCorrect(Q[x],A.st[i].ans),flag:!!A.flags[i]}));
  const ok=res.filter(r=>r.ok).length, score=Math.round(ok/res.length*1000);
  const used=Math.min(EXAM_MIN*60,Math.round((Date.now()-(A.endAt-EXAM_MIN*60000))/1000));
  const rec=store.exams[A.exam]||{}; rec.count=(rec.count||0)+1; rec.last=score; rec.best=Math.max(rec.best||0,score); store.exams[A.exam]=rec;
  res.forEach(r=>{store.study[r.id]=r.ok});
  store.lastResult={exam:A.exam,res,score,ok,used}; delete store.active; save();
  examResult("all");
}
function examResult(filter){
  view="eres"; setDock(""); window.scrollTo(0,0);
  const R=store.lastResult, n=R.res.length, by={};
  R.res.forEach(r=>{const d=Q[r.id].d;by[d]=by[d]||{n:0,ok:0};by[d].n++;if(r.ok)by[d].ok++});
  const list=R.res.map((r,i)=>({...r,i})).filter(r=>filter==="all"||(filter==="ng"&&!r.ok)||(filter==="flag"&&r.flag));
  app.innerHTML=`<header class="top"><div><div class="code">MOCK EXAM ${R.exam+1}・RESULT</div><h1>模擬試験 ${R.exam+1} の結果</h1></div></header>
  <section class="card"><div class="score">${R.score}<small> / 1000</small></div>
   <div><span class="pass ${R.score>=PASS?"ok":"ng"}">${R.score>=PASS?"合格ライン（700）到達":"合格ライン（700）未達"}</span></div>
   <p class="meta">${n} 問中 ${R.ok} 問正解 ・ 所要時間 ${fmt(R.used)}</p>
   <table class="sum">${Object.keys(DOMAINS).filter(d=>by[d]).map(d=>`<tr><td>${DOMAINS[d].name}</td><td>${by[d].ok} / ${by[d].n}</td></tr>`).join("")}</table></section>
  <div class="actions"><button class="btn" id="again">もう一度受ける</button><button class="btn ghost" id="back">トップへ戻る</button></div>
  <h2>解答の見直し</h2>
  <div class="tabs"><button data-f="all" class="${filter==="all"?"on":""}">すべて</button><button data-f="ng" class="${filter==="ng"?"on":""}">不正解のみ（${R.res.filter(r=>!r.ok).length}）</button><button data-f="flag" class="${filter==="flag"?"on":""}">見直しマーク（${R.res.filter(r=>r.flag).length}）</button></div>
  <div id="rev" style="display:flex;flex-direction:column;gap:10px">${list.length?list.map(r=>`<details class="rev" data-i="${r.i}"><summary><span class="mk ${r.ok?"ok":"ng"}">${r.ok?"○":"×"}</span><span class="count">問${r.i+1}</span><span class="t">${esc(Q[r.id].q)}</span></summary><div class="qb"></div></details>`).join(""):`<p class="meta">該当する問題はありません。</p>`}</div>`;
  document.getElementById("again").onclick=()=>examIntro(R.exam);
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>examResult(b.dataset.f));
  app.querySelectorAll("details.rev").forEach(d=>d.addEventListener("toggle",()=>{
    if(!d.open||d.dataset.done)return; d.dataset.done=1; const r=R.res[+d.dataset.i], q=Q[r.id];
    const box=d.querySelector(".qb"); const inner=document.createElement("div"); box.appendChild(inner);
    renderQuestion(inner,q,r.st,{locked:true,reveal:true,onChange:()=>{}});
    box.insertAdjacentHTML("beforeend",explainHTML(q,r.ok));}));
}

if(store.active && store.active.endAt<=Date.now()) examFinish(); else home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body>
</html>
